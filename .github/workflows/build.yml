name: build
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: test-screenshots, path: test/out, if-no-files-found: ignore }
  windows:
    needs: test
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: RoadHogs-windows, path: dist/*.exe, if-no-files-found: error }
      # ana dala her birleştirmede indirilebilir sürüm yayınla (Releases sayfası)
      - if: github.ref == 'refs/heads/main'
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "v0.1.${{ github.run_number }}" dist/*.exe --title "Road Hogs v0.1.${{ github.run_number }}" --notes "Otomatik derleme (${{ github.sha }})" --latest
