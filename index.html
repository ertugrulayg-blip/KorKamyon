<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Road Hogs</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9fd4ff;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{display:block}
  #menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#1f2a44,#d8432f);z-index:10}
  #menu .kart{background:#fff;color:#1a1a1a;border-radius:24px;padding:28px;width:min(92vw,380px);box-shadow:0 20px 60px rgba(0,0,0,.4)}
  #menu h1{margin:0 0 4px;font-size:34px;letter-spacing:-1px}
  #menu p{margin:0 0 16px;color:#555;font-size:14px;line-height:1.4}
  #menu input{width:100%;box-sizing:border-box;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid #ddd;margin-bottom:10px}
  #menu button{width:100%;font-size:18px;font-weight:800;padding:14px;border-radius:12px;border:0;background:#d8432f;color:#fff;margin-bottom:10px;cursor:pointer}
  #menu button.iki{background:#1f2a44}
  #menu .sat{display:flex;gap:8px}#menu .sat input{flex:1;text-transform:uppercase;margin:0}#menu .sat button{width:auto;margin:0;padding:12px 18px}
  #durum{font-size:13px;color:#d8432f;min-height:18px;margin-top:8px}
  #hud{position:fixed;inset:0;pointer-events:none;display:none;text-shadow:0 2px 4px rgba(0,0,0,.6)}
  #rol{position:absolute;left:12px;top:10px;font-size:14px;line-height:1.5;max-width:46vw}
  #rol b{font-size:20px}
  #sag{position:absolute;right:12px;top:10px;text-align:right;font-size:15px;font-weight:700}
  #yakit,#can{width:180px;height:16px;border:2px solid #fff;border-radius:9px;overflow:hidden;margin:4px 0 4px auto;background:rgba(0,0,0,.3)}
  #yakit i,#can i{display:block;height:100%;background:#7bd389}
  #afis{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:26px;font-weight:900}
  #afis div{margin:6px 0}
  #afis .uyari{color:#ffe14d}#afis .buyuk{font-size:54px}
  #dok{position:fixed;inset:0;display:none;pointer-events:none}
  #tumsek{position:absolute;left:50%;top:17%;transform:translateX(-50%);display:none;background:#ffd23f;color:#1a1a1a;text-shadow:none;font-weight:900;font-size:18px;padding:8px 16px;border-radius:12px;border:3px solid #1a1a1a;white-space:nowrap}
  #tumsek.hizli{background:#ff5a5f;color:#fff;animation:yan .4s infinite alternate}
  @keyframes yan{to{transform:translateX(-50%) scale(1.08)}}
  #isaret{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:64px;font-weight:900;color:#ffe14d;display:none}
  #isaret.sofor{font-size:110px}
  #afis{top:28%}
  #afis.alt{top:auto !important;bottom:3%;font-size:22px}#afis.alt div{margin:3px 0}
  /* dokunmatik kontroller: rol başına bir panel */
  /* --k: oyuncunun A−/A+ ile seçtiği tuş boyutu çarpanı (telefonlar arası fark için) */
  #dok{--k:1;--S:calc(min(92vw,62vh,380px)*var(--k));--PH:calc(min(46vh,230px)*var(--k));--OH:calc(min(30vh,160px)*var(--k))}
  #dok .pan{display:none;position:absolute;left:0;right:0;bottom:0;top:0}
  #dok[data-r="0"] #pk,#dok[data-r="1"] #ps,#dok[data-r="2"] #py{display:block}
  #dok b{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:18px;background:rgba(0,0,0,.4);border:3px solid rgba(255,255,255,.7);font-size:calc(17px*var(--k));font-weight:900;line-height:1.1}
  #dok b.bas{background:rgba(255,225,77,.75);color:#1a1a1a;text-shadow:none}
  #boy{position:absolute;left:50%;top:6px;transform:translateX(-50%);display:flex;gap:8px}
  #dok #boy b{position:static;width:52px;height:38px;font-size:16px;border-radius:10px;border-width:2px;opacity:.75}
  #dok[data-r="L"] #boy{display:none}
  #halka{position:absolute;left:50%;bottom:10px;width:var(--S);height:var(--S);transform:translateX(-50%)}
  #halka b{left:50%;top:50%;width:calc(var(--S)*.25);height:calc(var(--S)*.25);border-radius:50%;font-size:calc(var(--S)*.043);transform:translate(-50%,-50%) rotate(var(--a)) translateX(calc(var(--S)*.375)) rotate(calc(-1*var(--a)))}
  #joy{position:absolute;left:28%;top:28%;width:44%;height:44%;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.7);pointer-events:auto}
  #joy i{position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;background:rgba(255,255,255,.8)}
  #joy span{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:calc(var(--S)*.036);font-weight:900;opacity:.8}
  #ps .pedal{bottom:14px;width:calc(min(23vw,150px)*var(--k));height:var(--PH);font-size:calc(24px*var(--k))}
  #ps .fren{left:12px;background:rgba(216,67,47,.55)} #ps .gaz{right:12px;background:rgba(80,180,100,.55)}
  #ps .fren.bas{background:#ff5a5f;color:#fff}#ps .gaz.bas{background:#7bd389}
  #dir{position:absolute;left:50%;bottom:14px;width:calc(min(42vw,54vh,290px)*var(--k));height:calc(min(42vw,54vh,290px)*var(--k));transform:translateX(-50%);pointer-events:auto}
  #dir i{position:absolute;inset:0;border-radius:50%;border:calc(15px*var(--k)) solid rgba(20,20,20,.75);box-sizing:border-box;background:linear-gradient(rgba(20,20,20,.75),rgba(20,20,20,.75)) center/100% 14px no-repeat,linear-gradient(#d8432f,#d8432f) 50% 0/14px 50% no-repeat}
  #dir span{position:absolute;left:0;right:0;top:-24px;text-align:center;font-size:15px;font-weight:900;white-space:nowrap}
  #ps .kucuk,#py .kucuk{width:calc(110px*var(--k));height:calc(60px*var(--k));font-size:calc(18px*var(--k))}
  #ps .kucuk{left:12px;bottom:calc(var(--PH) + 26px)}
  #py .ok{bottom:14px;width:30vw;height:var(--OH);font-size:calc(26px*var(--k))}
  #py .ok[data-k="sl"]{left:2vw}#py .ok[data-k="yv"]{left:35vw}#py .ok[data-k="sr"]{right:2vw}
  #py .kucuk[data-k="s"]{left:2vw;bottom:calc(var(--OH) + 24px)}#py .kucuk[data-k="c"]{left:calc(2vw + 120px*var(--k));bottom:calc(var(--OH) + 24px)}
  @media (pointer:coarse){#dok{display:block}
    #rol{font-size:18px;line-height:1.35;max-width:52vw}#rol b{font-size:26px}
    #sag{font-size:20px}#yakit,#can{width:min(44vw,240px);height:24px;border-width:3px;border-radius:13px}
    #tumsek{font-size:24px;padding:10px 18px;top:21%;max-width:92vw;white-space:normal;text-align:center}
    #afis{font-size:28px;top:33%}#afis div[style]{font-size:21px !important}
    #isaret{font-size:76px;top:40%}#isaret.sofor{font-size:120px}}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="menu"><div class="kart">
  <h1>🚚 Road Hogs</h1>
  <p>Şoför önünü göremez, yolcu tarif eder, kasadakiler yakıt ve lastikle uğraşır. Kamyon durursa oyun biter. 2–4 kişi.</p>
  <input id="ad" maxlength="12" placeholder="Adın">
  <button id="kur">Oda kur</button>
  <div class="sat"><input id="kod" maxlength="4" placeholder="KOD"><button id="katil" class="iki">Katıl</button></div>
  <div id="durum"></div>
</div></div>
<div id="hud">
  <div id="rol"></div>
  <div id="sag"><div id="oda"></div><div id="yakit"><i></i></div><div id="can"><i></i></div><div id="bilgi"></div></div>
  <div id="tumsek"></div>
  <div id="isaret"></div>
  <div id="afis"></div>
</div>
<div id="dok" data-r="0">
  <div id="boy"><b data-z="-1">A−</b><b data-z="1">A+</b></div>
  <div id="pk" class="pan"><div id="halka">
    <div id="joy"><i></i><span>HAREKET</span></div>
    <b data-k="g" style="--a:150deg">TUT</b><b data-k="p" style="--a:195deg">ŞAPLAK</b><b data-k="j" style="--a:240deg">ZIPLA</b>
    <b data-k="u" style="--a:300deg">KULLAN</b><b data-k="s" style="--a:345deg">OTUR</b><b data-k="c" style="--a:30deg">TANKER</b>
  </div></div>
  <div id="ps" class="pan">
    <b data-k="s" class="kucuk">KALK</b>
    <b data-k="fr" class="pedal fren">FREN</b>
    <div id="dir"><span>◀ DİREKSİYON ▶</span><i></i></div>
    <b data-k="ga" class="pedal gaz">GAZ</b>
  </div>
  <div id="py" class="pan">
    <b data-k="s" class="kucuk">KALK</b><b data-k="c" class="kucuk">TANKER</b>
    <b data-k="sl" class="ok">⬅<br>SOLA DÖN</b><b data-k="yv" class="ok">🐢<br>YAVAŞLA</b><b data-k="sr" class="ok">➡<br>SAĞA DÖN</b>
  </div>
</div>
<script type="module" src="game.js?v=20"></script>
</body>
</html>
